server:
  AppVersion: 1.0.0
  Port: :3000
  Mode: development
  ReadTimeout: 5
  WriteTimeout: 5
  JwtSecretKey: superSecret
  CSRF: true

logger:
  Development: true
  DisableCaller: false
  DisableStacktrace: false
  Encoding: json
  Level: info

postgres:
  PostgresqlHost: localhost
  PostgresqlPort: 5432
  PostgresqlUser: postgres
  PostgresqlPassword: postgres
  PostgresqlDBName: postgres
  PostgresqlSSLMode: disable
  PostgresqlDriver: pgx

  redis:
    RedisAddr: localhost:6379
    RedisPassword:
    RedisDb: 0
    RedisDefaultdb: 0
    MinIdleConns: 200
    PoolSize: 12000
    PoolTimeout: 240
    Password: ""
    DB: 0

  cookie:
    Name: jwt-token
    MaxAge: 86400
    Secure: false
    HttpOnly: true

  session:
    Name: session-id
    Prefix: api-session
    Expire: 3600